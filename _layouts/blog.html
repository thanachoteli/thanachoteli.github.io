<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: 'Notes on technology, photography, and things Thanachote enjoys.' | escape }}" />
  <title>{{ page.title | escape }} — {{ site.title | escape }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
<div class="site-wrap blog-wrap">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="nav-logo" href="{{ '/' | relative_url }}">Thanachote Li</a>
    <ul class="nav-links">
      <li><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
      <li><a href="{{ '/photo.html' | relative_url }}">Photography</a></li>
      <li><a href="{{ '/blog.html' | relative_url }}" class="active" aria-current="page">Blog</a></li>
      <li><a href="{{ '/cv.html' | relative_url }}">CV</a></li>
    </ul>
  </nav>
  {{ content }}
  <footer class="site-footer">
    <p>© 2026 Thanachote Li</p>
    <ul class="footer-links">
      <li><a href="https://github.com/thanachoteli" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/thanachote-li-000aa525b/" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </footer>
</div>
<script src="{{ '/blog.js' | relative_url }}" defer></script>
</body>
</html>
