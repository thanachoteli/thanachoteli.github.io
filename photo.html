  <style>
    /* Larger grid for photo page */
    .photo-grid-full {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .photo-grid-full .photo-item {
      aspect-ratio: 3/2;
    }

    /* Wide item spans 2 columns */
    .photo-item.wide {
      grid-column: span 2;
      aspect-ratio: 16/7;
    }

    @media (max-width: 600px) {
      .photo-grid-full { grid-template-columns: 1fr; }
      .photo-item.wide { grid-column: span 1; aspect-ratio: 3/2; }
    }
  </style>
</head>
